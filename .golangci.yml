run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - build
    - dist

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - gosec
    - ineffassign
    - misspell
    - unconvert
    - goconst
    - gocyclo
    - gocognit
    - lll
    - unparam
    - staticcheck
    - gosimple
    - unused

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/b2network/pulsar
  govet:
    check-shadowing: true
  lll:
    line-length: 120
  gocyclo:
    min-complexity: 15
  gocognit:
    min-complexity: 20

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - gocyclo
        - gocognit