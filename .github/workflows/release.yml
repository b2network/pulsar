name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Build binaries
        run: |
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o build/pulsard-linux-amd64 ./cmd/pulsard
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o build/pulsard-linux-arm64 ./cmd/pulsard
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -o build/pulsard-darwin-amd64 ./cmd/pulsard
          
          # macOS ARM64
          GOOS=darwin GOARCH=arm64 go build -o build/pulsard-darwin-arm64 ./cmd/pulsard
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -o build/pulsard-windows-amd64.exe ./cmd/pulsard
          
      - name: Create checksums
        run: |
          cd build
          sha256sum * > checksums.txt
          
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/pulsard-*
            build/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false